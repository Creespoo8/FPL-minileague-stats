<style>
  :root{
    --purple-950:#1c0021;
    --purple-900:#2b0030;
    --purple-800:#37003c;
    --purple-700:#4a0a52;
    --panel:#33073a;
    --line: rgba(242,238,244,0.10);
    --green:#00ff85;
    --pink:#e90052;
    --cyan:#04f5ff;
    --gold:#ffd166;
    --text:#f2eef4;
    --text-dim:#c6b9cb;
    --text-mute:#9a8aa0;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 12% -10%, rgba(0,255,133,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(233,0,82,0.14), transparent 55%),
      var(--purple-900);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:32px 20px 80px;}

  h1,h2,h3,.num{font-family:'Space Grotesk',sans-serif;}

  /* ---------- HERO ---------- */
  .hero{
    display:flex; flex-wrap:wrap; gap:28px;
    justify-content:space-between; align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:28px; margin-bottom:28px;
  }
  .hero-left .eyebrow{
    color:var(--green); font-weight:600; font-size:13px; letter-spacing:0.02em;
    margin:0 0 6px;
  }
  .hero-left h1{
    font-size:clamp(28px,5vw,42px); line-height:1.05; margin:0 0 8px; font-weight:700;
  }
  .hero-left p{color:var(--text-dim); margin:0; max-width:520px; font-size:15px;}
  .leader-card{
    background:linear-gradient(160deg, var(--panel), var(--purple-800));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 24px; min-width:230px;
  }
  .leader-card .label{color:var(--text-mute); font-size:12px; margin-bottom:6px;}
  .leader-card .name{font-size:19px; font-weight:700; margin-bottom:10px;}
  .leader-card .points{font-size:38px; font-weight:700; color:var(--green); line-height:1;}
  .leader-card .points span{font-size:14px; color:var(--text-mute); font-weight:500; margin-left:6px;}

  /* ---------- NAV ---------- */
  nav{
    display:flex; gap:6px; flex-wrap:wrap;
    margin-bottom:28px; border-bottom:1px solid var(--line); padding-bottom:2px;
  }
  nav button{
    background:none; border:none; color:var(--text-mute);
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    padding:10px 14px; cursor:pointer; border-radius:8px 8px 0 0;
    position:relative; top:1px;
  }
  nav button.active{
    color:var(--text); border-bottom:2px solid var(--green);
  }
  nav button:hover{color:var(--text);}

  section.panel{display:none;}
  section.panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:20px;
  }
  .card h2{font-size:17px; margin:0 0 4px; font-weight:700;}
  .card .sub{color:var(--text-mute); font-size:13px; margin:0 0 16px;}

  /* ---------- TABLE ---------- */
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{
    text-align:left; color:var(--text-mute); font-weight:600; font-size:12px;
    padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap;
  }
  th:hover{color:var(--text);}
  th.num, td.num{text-align:right;}
  td{padding:10px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr.me td{color:var(--text);}
  td.rank{color:var(--text-mute); font-variant-numeric:tabular-nums;}
  td.player{font-weight:600;}
  td.total{color:var(--green); font-weight:700; font-variant-numeric:tabular-nums;}
  .table-scroll{overflow-x:auto;}
  .form-bar{display:flex; gap:2px; align-items:flex-end; height:22px;}
  .form-bar i{display:block; width:4px; background:var(--cyan); border-radius:1px; opacity:0.85;}

  /* ---------- CHART ---------- */
  .chart-wrap{position:relative; height:360px;}
  .legend-pills{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .pill{
    font-size:12px; padding:5px 10px; border-radius:999px; border:1px solid var(--line);
    color:var(--text-dim); cursor:pointer; user-select:none; font-weight:500;
  }
  .pill.on{color:var(--purple-900); font-weight:700;}

  /* ---------- RECORDS ---------- */
  .records-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media(max-width:720px){.records-grid{grid-template-columns:1fr;}}
  .rec-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;
  }
  .rec-row:last-child{border-bottom:none;}
  .rec-rank{color:var(--text-mute); width:22px; font-variant-numeric:tabular-nums; font-size:13px;}
  .rec-name{flex:1; font-weight:600; padding:0 8px;}
  .rec-meta{color:var(--text-mute); font-size:12px; margin-right:10px;}
  .rec-pts{font-weight:700; font-variant-numeric:tabular-nums;}
  .rec-pts.good{color:var(--green);}
  .rec-pts.bad{color:var(--pink);}

  /* ---------- MOTM ---------- */
  .motm-list{display:flex; flex-direction:column; gap:10px;}
  .motm-row{
    display:grid; grid-template-columns:90px 1fr 1fr 1fr; gap:10px; align-items:center;
    padding:10px 12px; background:rgba(0,0,0,0.14); border-radius:10px; font-size:13px;
  }
  @media(max-width:640px){.motm-row{grid-template-columns:70px 1fr; grid-template-rows:auto auto auto;}}
  .motm-month{color:var(--text-mute); font-weight:600; font-size:12px;}
  .medal{display:flex; align-items:center; gap:8px;}
  .medal-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .medal-name{font-weight:600;}
  .medal-pts{color:var(--text-mute); font-size:12px;}

  /* ---------- WIN/LOSE ---------- */
  .wl-bars{display:flex; flex-direction:column; gap:10px;}
  .wl-row{display:grid; grid-template-columns:120px 1fr 34px; gap:10px; align-items:center; font-size:13px;}
  .wl-name{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .wl-track{background:rgba(0,0,0,0.25); border-radius:6px; height:14px; overflow:hidden;}
  .wl-fill{height:100%; border-radius:6px;}
  .wl-count{text-align:right; font-variant-numeric:tabular-nums; color:var(--text-dim);}

  footer{color:var(--text-mute); font-size:12px; text-align:center; margin-top:40px;}
  footer a{color:var(--text-dim);}
</style>
</head>
